services:
  - type: web
    name: wibby-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://wibby024.web.app,https://wibby024.firebaseapp.com,https://wibby.web.app
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: wibby
      - key: FIREBASE_PROJECT_ID
        value: wibby024
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: STORAGE_PROVIDER
        value: gridfs
      - key: TURN_SERVER_URL
        sync: false
      - key: TURN_SHARED_SECRET
        sync: false
      - key: TURN_SERVER_USERNAME
        sync: false
      - key: TURN_SERVER_CREDENTIAL
        sync: false
