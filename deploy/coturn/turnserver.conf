# ==============================================================================
# WIBBY — ZERO-COST (₹0) COTURN (STUN / TURN) CONFIGURATION
# Location: /etc/turnserver.conf
# ==============================================================================

# Network ports
listening-port=3478
tls-listening-port=5349

# Realm and Authentication
realm=wibby024.web.app
lt-cred-mech
fingerprint

# Dynamic Ephemeral Credentials (RFC 5766 REST API format)
use-auth-secret
static-auth-secret=YOUR_COTURN_SHARED_SECRET_REPLACE_ME

# UDP media relay port range (Configured in Oracle Cloud VCN Security List & UFW)
min-port=49152
max-port=65535

# SSL/TLS Certificates (If using Let's Encrypt on free hostname)
# cert=/etc/letsencrypt/live/wibby-api/fullchain.pem
# pkey=/etc/letsencrypt/live/wibby-api/privkey.pem

# Security and Bandwidth Limits
no-cli
no-loopback-peers
no-multicast-peers
mobility
bps-capacity=0
total-quota=100
max-bps=3000000

# Logging
syslog
verbose
