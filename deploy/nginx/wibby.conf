# ==============================================================================
# WIBBY — ZERO-COST (₹0) BACKEND NGINX REVERSE PROXY CONFIGURATION
# Location: /etc/nginx/sites-available/wibby
# Target: Free Subdomain (e.g. wibby024.duckdns.org or <ORACLE_IP>.sslip.io)
# ==============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

# ------------------------------------------------------------------------------
# 1. HTTP to HTTPS Redirection & Let's Encrypt ACME Challenge
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Backend API & WebSocket Signaling Server Block
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _; # Matches your free DuckDNS / sslip.io hostname

    # SSL Certificates (Managed at ₹0 via Certbot Let's Encrypt)
    # certbot --nginx -d YOUR_FREE_HOSTNAME (e.g. wibby024.duckdns.org)
    ssl_certificate /etc/letsencrypt/live/wibby-api/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wibby-api/privkey.pem;

    # Modern TLS Security & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Media Upload Size Limit (100MB max)
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Node.js Express REST API Upstream
    location / {
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn addr_limit 50;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket Upgrade Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Dedicated Socket.IO Realtime Signaling Route
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000/socket.io/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
        proxy_buffering off;
    }
}
