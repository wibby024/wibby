<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="55%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background pill -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- Subtle inner highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15.2" fill="url(#glow)"/>

  <!-- Border rim -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.8" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>

  <!-- Wibby W-wave -->
  <path
    d="M14 26
       C14 34 19.5 42 23.5 42
       C26.5 42 28.5 36 32 36
       C35.5 36 37.5 42 40.5 42
       C44.5 42 50 34 50 26"
    stroke="white"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Pink accent dot (partner eye) -->
  <circle cx="44" cy="21" r="4.5" fill="#F472B6"/>
  <!-- White dot (self eye) -->
  <circle cx="20" cy="21" r="4.5" fill="white" opacity="0.95"/>
</svg>